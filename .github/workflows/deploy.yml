name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://mjgbutsalhagtoiurruw.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qZ2J1dHNhbGhhZ3RvaXVycnV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTYxNjMsImV4cCI6MjEwNzEzMjE2M30.AAJcXb0DvCHhkBDxniJU8DIbFOAkpbR43GfIqPnGVGI' }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID || '6c0d7d13dc50efb69a5282791769543e' }}
          VITE_RELIEF_TRACKER_CONTRACT_ADDRESS: ${{ secrets.VITE_RELIEF_TRACKER_CONTRACT_ADDRESS || '0xd2e957dda5a5099980a66ecc736b541590892588' }}
          VITE_BATCH_TOKEN_CONTRACT_ADDRESS: ${{ secrets.VITE_BATCH_TOKEN_CONTRACT_ADDRESS || '0xd2e957dda5a5099980a66ecc736b541590892588' }}
          VITE_HANDOVER_CONTRACT_ADDRESS: ${{ secrets.VITE_HANDOVER_CONTRACT_ADDRESS || '0xd2e957dda5a5099980a66ecc736b541590892588' }}
          VITE_BLOCKCHAIN_CHAIN_ID: '11155111'
          VITE_BLOCKCHAIN_CHAIN_NAME: 'Sepolia'
          VITE_BLOCKCHAIN_RPC_URL: ${{ secrets.VITE_BLOCKCHAIN_RPC_URL || 'https://eth-sepolia.g.alchemy.com/v2/omM_Iuble2BuREAtDvGm-' }}
          VITE_BUNDLER_RPC_URL: ${{ secrets.VITE_BUNDLER_RPC_URL || 'https://api.pimlico.io/v2/11155111/rpc?apikey=pim_demo' }}
          VITE_PAYMASTER_RPC_URL: ${{ secrets.VITE_PAYMASTER_RPC_URL || 'https://api.pimlico.io/v2/11155111/rpc?apikey=pim_demo' }}
          VITE_ENTRYPOINT_ADDRESS: ${{ secrets.VITE_ENTRYPOINT_ADDRESS || '0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789' }}
          VITE_BACKEND_WORKER_ADDRESS: ${{ secrets.VITE_BACKEND_WORKER_ADDRESS || '0xd2e957dda5a5099980a66ecc736b541590892588' }}
        run: npm run build

      - name: Ensure SPA 404 fallback exists
        run: |
          if [ -f dist/index.html ] && [ ! -f dist/404.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
