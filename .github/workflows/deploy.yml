name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://mjgbutsalhagtoiurruw.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qZ2J1dHNhbGhhZ3RvaXVycnV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTYxNjMsImV4cCI6MjEwNzEzMjE2M30.AAJcXb0DvCHhkBDxniJU8DIbFOAkpbR43GfIqPnGVGI' }}
          VITE_RELIEF_TRACKER_CONTRACT_ADDRESS: ${{ secrets.VITE_RELIEF_TRACKER_CONTRACT_ADDRESS || '0x9d6FBCE1BDfc9c6fAD604c1640aB13252d3296A8' }}
          VITE_BATCH_TOKEN_CONTRACT_ADDRESS: ${{ secrets.VITE_BATCH_TOKEN_CONTRACT_ADDRESS || '0x9d6FBCE1BDfc9c6fAD604c1640aB13252d3296A8' }}
          VITE_HANDOVER_CONTRACT_ADDRESS: ${{ secrets.VITE_HANDOVER_CONTRACT_ADDRESS || '0x9d6FBCE1BDfc9c6fAD604c1640aB13252d3296A8' }}
          VITE_BLOCKCHAIN_CHAIN_ID: '11155111'
          VITE_BLOCKCHAIN_CHAIN_NAME: 'Sepolia'
          VITE_BLOCKCHAIN_RPC_URL: ${{ secrets.VITE_BLOCKCHAIN_RPC_URL || 'https://eth-sepolia.g.alchemy.com/v2/omM_Iuble2BuREAtDvGm-' }}
          VITE_BUNDLER_RPC_URL: ${{ secrets.VITE_BUNDLER_RPC_URL || 'https://eth-sepolia.g.alchemy.com/v2/omM_Iuble2BuREAtDvGm-' }}
          VITE_PAYMASTER_RPC_URL: ${{ secrets.VITE_PAYMASTER_RPC_URL || 'https://eth-sepolia.g.alchemy.com/v2/omM_Iuble2BuREAtDvGm-' }}
          VITE_PAYMASTER_POLICY_ID: ${{ secrets.VITE_PAYMASTER_POLICY_ID || '279eadf8-e338-4d09-ba15-52702854bbd6' }}
          VITE_ENTRYPOINT_ADDRESS: ${{ secrets.VITE_ENTRYPOINT_ADDRESS || '0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789' }}
          VITE_BACKEND_WORKER_ADDRESS: ${{ secrets.VITE_BACKEND_WORKER_ADDRESS || '0x9d6FBCE1BDfc9c6fAD604c1640aB13252d3296A8' }}
          VITE_SEPOLIA_RELAYER_PRIVATE_KEY: ${{ secrets.VITE_SEPOLIA_RELAYER_PRIVATE_KEY || 'c446e16ce595479615536119ec005787f7d38d8f95f62cbd0870fa7295b12f7e' }}
        run: npm run build

      - name: Ensure SPA 404 fallback exists
        run: |
          if [ -f dist/index.html ] && [ ! -f dist/404.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
